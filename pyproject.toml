[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[project]
name = "pypostcards"
authors = [
  {name = "bibi21000", email = "bibi21000@gmail.com"},
]
maintainers = [
  {name = "bibi21000", email = "bibi21000@gmail.com"}
]
description = "Scan, manage and publish your postcards collection"
version = "4.2.11"
requires-python = ">=3.9"
dependencies = [
    "pillow",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
flask = [
    "Flask",
    "Flask-Babel",
    "Werkzeug",
    "Jinja2",
    "MarkupSafe",
    "Flask-Cachecontrol",
    "itsdangerous",
    "requests",
    "PyJWT",
    "redis",
    "flask-limiter",
    "Flask-Caching",
]
prod = [
    "gunicorn"
]

ktmanager = [
    "click",
    "numpy",
    "tqdm",
    "pyzstd",
    "paramiko",
    "requests",          # kttools delcampe watchlist
    "beautifulsoup4",    # kttools delcampe watchlist
]
ktimport = [
    "click",
    "tqdm",
    "deskew",
    "opencv-python-headless",
    "numpy"
]
ocr = [
    "pytesseract",
]
# PaddleOCR engine (see [tkimport] ocr_engine). This extra does NOT install
# the PaddlePaddle framework, on purpose: install it first, for your platform
# (PyPI's "paddlepaddle" has wheels only for CPython 3.9-3.13 on Linux x86_64,
# macOS arm64 and Windows, and is CPU-only):
#   CPU:  pip install paddlepaddle -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
#   GPU:  pip install paddlepaddle-gpu -i https://www.paddlepaddle.org.cn/packages/stable/cu126/
# Letting this extra pull "paddlepaddle" would fail on the other platforms and
# would clash with a GPU build.
paddleocr = [
    "paddleocr",
    "numpy",
]
colmap = [
    "pycolmap",
]
masks = [
    "pillow",
    "numpy",
    "opencv-python-headless",
    "torch",
    "transformers",
    "tqdm",
]
similar = [
    "requests",
    "imagehash",
    "torch",
    "torchvision",
    "open-clip-torch",
]
tools = [
    "fastapi",
    "httpx",
    "uvicorn[standard]",
    "cryptography",
    "pydantic",
    "pydantic-settings",
]
deskew = [
    "deskew",
    "opencv-python-headless",
    "numpy"
]
travel = [
    "ortools"
]
detection = [
    "transformers",
    "torch",
    "deep-translator",
]
# Server-side translation only (POST /api/translate, "lang" of
# /api/compute_detection) on a machine without torch.
translate = [
    "deep-translator",
]
# Local translation engine (translate_engine = marian or auto in
# [simpostcards]): Marian models, no rate limit, no network once downloaded.
# Needs deep-translator too (it names the languages). sentencepiece has wheels
# up to CPython 3.14, sacremoses is pure Python.
translate-local = [
    "deep-translator",
    "transformers",
    "torch",
    "sentencepiece",
    "sacremoses",
]

dev = [
    "build",
    "pytest",
    "coverage",
    "ruff",
    "Babel",
    "httpx"
    ]

appimage = [
    "python-appimage",
]

[project.urls]
HomePage = "https://github.com/bibi21000/KartoTek_app"
Issues = "https://github.com/bibi21000/KartoTek_app/issues"

[project.scripts]
kttools = "tkpostcards.scripts.tktools:cli"
ktmanager = "tkpostcards.tkmanager:run"
ktimport = "tkpostcards.tkimport:run"
ktscan = "tkpostcards.tkscan:run"
simrun = "simpostcards.run:main"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = [
    "tests"
]

[tool.babel]
domain = "flpostcards"
mapping_file = "babel.cfg"

[tool.setuptools.package-data]
tkpostcards = [
    "translations/**/*.po",
    "translations/**/*.mo",
    "images/*.png",
]
flpostcards = [
    "translations/**/*.po",
    "translations/**/*.mo",
    "templates/**/*",
    "static/**/*",
    "themes/**/*",
    "deprecations.json",
]
libpostcards = [
    "translations/**/*.po",
    "translations/**/*.mo",
]
simpostcards = [
    "translations/**/*.po",
    "translations/**/*.mo",
]
toolspostcards = [
    "translations/**/*.po",
    "translations/**/*.mo",
]

